{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Brochure | Nesto Property</title>

  <!-- AOS CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/form.css' %}">
</head>
<style>


.button-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px; /* 👈 Adds visible spacing */
}

.btn-link-custom {
  display: inline-block;
  text-decoration: none;
  font-weight: 600;
 
  border-radius: 25px;
  padding: 8px 20px;
  transition: all 0.3s ease;
}

.btn-link-custom:hover {
  {% comment %} background-color: #007bff; {% endcomment %}
  color: #007bff;
}


</style>
<body>

  <div class="container" data-aos="zoom-in">
    <!-- ✅ Send form to submit_contact instead of login -->
    <form method="POST" action="{% url 'login' %}" class="login-form">
      {% csrf_token %}
      <h2>Submit Your Details 🏢</h2>

      <div class="input-group" data-aos="fade-right" data-aos-delay="200">
        <label for="username">Full Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your name" required>
      </div>

      <div class="input-group" data-aos="fade-left" data-aos-delay="400">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group" data-aos="fade-left" data-aos-delay="600">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
      </div>

      <!-- ✅ Hidden fields to send page info and property -->
      <input type="hidden" name="page" value="{{ request.GET.page|default:'home' }}">
      <input type="hidden" name="property_id" value="{{ request.GET.id|default:'' }}">

      <button type="submit" data-aos="fade-up" data-aos-delay="800" style="background-color: #00C853; color: #fff;">
        Submit
      </button>

      <p class="register-text" data-aos="fade-up" data-aos-delay="1000">
        We’ll only use your details to provide brochures and updates.
      </p>

      <!-- ✅ Added Navigation Links -->
      
      <div class="text-center mt-3" data-aos="fade-up" data-aos-delay="1200">
  <div class="button-links">
    <a href="{% url 'home' %}" class="btn-link-custom">🏠 Home</a>
    <a href="{% url 'properties' %}" class="btn-link-custom">🏗️ Properties</a>
  </div>


    </div>



    </form>
  </div>

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init();</script>

  <!-- Custom JS -->
  <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
